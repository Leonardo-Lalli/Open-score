            "type": "integer"
          },
          "home_score": {
            "maximum": 999.0,
            "minimum": 0.0,
            "title": "Home Score",
            "type": "integer"
          },
          "invalidate": {
            "default": false,
            "title": "Invalidate",
            "type": "boolean"
          },
          "version": {
            "minimum": 1.0,
            "title": "Version",
            "type": "integer"
