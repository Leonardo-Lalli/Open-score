            "default": 2,
            "maximum": 8.0,
            "minimum": 2.0,
            "title": "Group Count",
            "type": "integer"
          },
          "legs": {
            "default": 1,
            "maximum": 2.0,
            "minimum": 1.0,
            "title": "Legs",
            "type": "integer"
          },
          "loss_points": {
            "default": 0,
            "maximum": 10.0,
            "minimum": 0.0,
            "title": "Loss Points",
            "type": "integer"
          },
