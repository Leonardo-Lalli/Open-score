            "default": "Calcio",
            "enum": [
              "Calcio",
              "Calcio a 5",
              "Basket",
              "Pallamano"
            ],
            "title": "Sport",
            "type": "string"
          },
          "team_names": {
            "items": {
              "maxLength": 60,
              "minLength": 1,
              "type": "string"
            },
            "maxItems": 32,
            "title": "Team Names",
            "type": "array"
          },
          "win_points": {
            "default": 3,
            "maximum": 10.0,
            "minimum": 0.0,
            "title": "Win Points",
            "type": "integer"
          }
        },
