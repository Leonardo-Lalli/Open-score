name: Open Score website

# Il sito è statico: non esiste un passo di build. La verifica controlla
# struttura, asset, link, temi e sintassi JavaScript; il deploy pubblica la
# cartella website/ con il meccanismo ufficiale di GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Permesso predefinito minimo: solo lettura del repository.
permissions:
  contents: read

# Un solo deployment alla volta e nessuna interruzione di quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verifica sito statico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10"
      - name: Verifica dipendenze Python
        run: python -m pip check
      - name: Controlla la sintassi JavaScript
        run: node --check website/script.js
      - name: Verifica struttura, asset, link, temi e workflow
        run: python -m pytest --noconftest -q torneo-lab/tests/test_website.py

  deploy:
    name: Pubblica su GitHub Pages
    needs: verify
    # Solo main: un dispatch manuale da un branch feature esegue la verifica
    # senza sovrascrivere il sito pubblico.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
