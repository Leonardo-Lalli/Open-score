name: Open Score website

# `website/` contiene due segnaposto (__SITE_BASE__, __SITE_URL__) che
# `.github/scripts/build_site.py` risolve in `_site/` leggendo
# `website/site.config.json`. Così lo stesso sito funziona sia sul percorso di
# progetto (/Open-score/) sia sulla radice di un dominio personalizzato.
# Il deploy usa il meccanismo ufficiale di GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Permesso predefinito minimo: solo lettura del repository.
permissions:
  contents: read

# Un solo deployment alla volta e nessuna interruzione di quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verifica sito statico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10"
      - name: Verifica dipendenze Python
        run: python -m pip check
      - name: Controlla la sintassi JavaScript
        run: node --check website/script.js
      - name: Genera il sito statico
        run: python .github/scripts/build_site.py
      - name: Verifica struttura, asset, link, temi e workflow
        run: python -m pytest --noconftest -q torneo-lab/tests/test_website.py

  deploy:
    name: Pubblica su GitHub Pages
    needs: verify
    # Solo main: un dispatch manuale da un branch feature esegue la verifica
    # senza sovrascrivere il sito pubblico.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genera il sito statico
        run: python .github/scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
